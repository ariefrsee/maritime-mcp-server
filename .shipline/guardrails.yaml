#      Direct instruction. Imperative voice. Specific enough to act on without
#      reading the retro it came from.

  - id: G7
    status: active
    title: Capture real data from an external source before planning against it
    reason: >
      The S02 plan was written from aisstream.io's published type definitions.
      Four of its premises were wrong: ship names arrive in a MetaData envelope
      on every message rather than only in ShipStaticData, a fourth message type
      exists that carries no navigational status, the field named Timestamp is a
      second of the minute rather than a clock, and every string is space padded.
      The plan's own risk table named this danger and then proposed mitigating it
      with a sample taken from the same documentation, which would have
      reproduced all four errors.
    applies_to: [backend, infrastructure]
    severity: critical
    discovered_in: S02
    discovered_on: 14/09/2026
    injection: >
      Before planning any integration with an external feed, API or file format,
      obtain a real sample and inspect it. A published schema describes what
      fields can exist, not which ones actually arrive, how often, in what
      envelope, or in what state. If credentials are needed to get a sample, ask
      for them before writing the plan rather than planning around their absence.
      Commit the captured sample as a fixture so later changes are checked
      against reality rather than against the documentation again.

  - id: G8
    status: active
    title: Never present externally sourced data in a field the source did not supply
    reason: >
      AIS does not transmit flag state, vessel length or nearest port, yet the
      tools report all three. Flag is derived from MMSI digits, length from hull
      dimensions, nearest port computed locally. Separately, the feed carries
      aids to navigation and malformed identifiers alongside ships, and the store
      was listing a navigation buoy as a vessel. Data that looks right and is
      wrong is worse than an obvious gap, because nobody checks it.
    applies_to: [backend, content]
    severity: high
    discovered_in: S02
    discovered_on: 14/09/2026
    injection: >
      When mapping external data into your own shape, keep track of which fields
      the source actually supplies and which you derive. A value the source did
      not send is either null or explicitly marked as derived, never a plausible
      default. An unrecognised code is reported as itself, for example "Unknown
      status 12", never mapped to the nearest known value. Check that the records
      you return are the kind of thing the caller asked for: a feed of vessels
      may contain objects that are not vessels.

  - id: G9
    status: active
    title: A change to an output contract is a gate decision, not a build decision
    reason: >
      S02 changed every tool's response from a bare list to an envelope in order
      to carry provenance. This was the right design, but S01 had explicitly
      pinned byte identical output as an acceptance criterion, and the user
      learned the guarantee had been broken from a build report rather than being
      asked. The cost happened to be zero because nothing external consumes these
      tools yet.
    applies_to: [backend, frontend, mobile, content, ops]
    severity: medium
    discovered_in: S02
    discovered_on: 14/09/2026
    injection: >
      If a change alters the shape of anything a caller consumes, a response
      body, a file format, a CLI output, stop and raise it with the user before
      building it, even when the change is clearly an improvement and even when
      nothing currently consumes it. Say what breaks, what depends on it today,
      and what the alternative would cost.

  - id: G10
    status: active
    title: Investigate small gaps in coverage rather than accepting them as rounding
    reason: >
      Ninety of ninety two vessels resolved a flag. The two that did not looked
      like noise and were in fact an entire category of object the server was
      mislabelling: an aid to navigation whose country digits sit in the middle
      of its MMSI, and a malformed identifier. Treating the gap as acceptable
      would have shipped a tool that reports buoys as ships.
    applies_to: [backend, infrastructure, ops]
    severity: medium
    discovered_in: S02
    discovered_on: 14/09/2026
    injection: >
      When a result covers most but not all of a dataset, examine the exceptions
      by name before accepting the number. A handful of failures is usually a
      category you have not modelled, not noise. State what each exception was
      and why it is acceptable, or fix it.

  - id: G11
    status: active
    title: A criterion that checks shape must not stand in for one that checks behaviour
    reason: >
      S02's plan promised that nearest_port would be computed from the project's
      port list. No implementation step covered it. AC-2 required that a mapped
      record carry the same nine keys as the bundled snapshot, and it did, with
      nearest_port present and permanently null. The criterion passed, the story
      was marked done, and the gap surfaced only when the user asked to see a
      real vessel end to end.
    applies_to: [backend, frontend, mobile, infrastructure, content, ops]
    severity: high
    discovered_in: S02
    discovered_on: 14/09/2026
    injection: >
      When writing acceptance criteria, check that each one would fail if the
      behaviour were absent. A criterion asserting that a key exists, that a file
      is present, or that a call returns without error does not prove the thing
      works. For every field or output a plan promises, write a criterion that
      asserts its value, not merely its presence. If a plan states a field is
      derived or computed, name the expected result for a concrete input.

  - id: G12
    status: active
    title: Write runbooks against the state after merging, not the branch you are on
    reason: >
      S01's runbook needed correcting twice and S02's once, always for the same
      reason: the setup and rollback sections described the branch state at the
      moment of writing. A checkout line that is correct on a feature branch is
      wrong the instant it merges, and rollback instructions that say delete the
      local branch are wrong once the work is published. Three corrective commits
      across two stories, all avoidable.
    applies_to: [backend, frontend, mobile, infrastructure, content, ops]
    severity: medium
    discovered_in: S02
    discovered_on: 14/09/2026
    injection: >
      Write a runbook for the state the work will be in once it is merged and
      published, because that is when people read it. Setup is a plain clone of
      the default branch. Rollback reverts a published merge commit rather than
      deleting a local branch. If the work genuinely is not merged yet, say so in
      one line at the top rather than threading branch names through the
      instructions, so exactly one line needs changing later.

  - id: G13
    status: active
    title: Never log an exception's message where a secret could be in scope
    reason: >
      The AIS collector authenticates by sending its API key in the first
      websocket frame. The natural error line, log.warning("failed: %s", exc),
      would print whatever the library put in that exception, and a handshake
      failure can echo the request. The key would land in the log, which is
      exactly the text people paste when asking for help.
    applies_to: [backend, infrastructure, ops]
    severity: critical
    discovered_in: S03
    discovered_on: 14/09/2026
    injection: >
      In any code path where a credential, token or key is in scope, log the
      exception type and your own context, never the exception's message or
      repr, and never the request. Write log.warning("connect failed (%s)",
      type(exc).__name__) rather than interpolating the exception. Verify by
      running the real failure path and searching the captured output for the
      secret, rather than assuming the library is careful.

  - id: G14
    status: active
    title: Treat a clean disconnect as a failure for retry purposes
    reason: >
      The obvious retry loop treats a session returning normally as success and
      reconnects at once. A server that accepts a connection and immediately
      closes it, which is what a rejected or rate limited credential looks like,
      returns normally. The result is an instant infinite reconnect loop against
      a free service with no SLA, while the code looks healthy.
    applies_to: [backend, infrastructure]
    severity: high
    discovered_in: S03
    discovered_on: 14/09/2026
    injection: >
      In a reconnect loop, success means the connection delivered something, not
      that it closed without raising. Have the session report whether it did any
      real work, treat a clean but empty session as a failure for backoff
      purposes, and cap consecutive failures so a persistently unhappy endpoint
      is abandoned rather than hammered.

  - id: G15
    status: active
    title: Say when a criterion was verified once against conditions that vary
    reason: >
      S03's vessel count and movement criteria were each checked one time,
      against real shipping traffic on one afternoon. The Strait of Malacca is
      busy at midday and far quieter at 0300, so a threshold of fifty vessels in
      five minutes could fail at night with the code entirely healthy, and
      nothing in the story would distinguish that from a regression.
    applies_to: [backend, frontend, mobile, infrastructure, content, ops]
    severity: medium
    discovered_in: S03
    discovered_on: 14/09/2026
    injection: >
      When a criterion depends on conditions outside your control, live traffic,
      time of day, third party load, record the conditions you observed and state
      that it was checked once. Do not present a single favourable run as a
      stable property. Where a threshold is involved, note what would make it
      fail for reasons unrelated to the code.

  - id: G16
    status: active
    title: Test the mixed case, not only total success and total failure
    reason: >
      S03's collector counted failures for the life of the process and never
      reset them after a healthy session, so a long running server would
      eventually stop collecting and silently serve stale fallback data. Seven
      acceptance criteria and eight test cases all passed over it, because every
      one exercised either an endpoint that never connects or one that never
      drops. The bug lived only in the alternating case, which is what real
      operation actually looks like. It was found by reading the code while
      writing the retro.
    applies_to: [backend, infrastructure, ops]
    severity: high
    discovered_in: S03
    discovered_on: 14/09/2026
    injection: >
      For any component with retry, caching, reconnection, rate limiting or
      accumulated state, test the alternating case explicitly: works, then fails,
      then works again. Testing only the all-good and all-bad paths leaves state
      that accumulates across cycles completely uncovered, and that is where this
      class of bug lives. Ask what the counter, cache or backoff looks like after
      the third cycle, not after the first.

  - id: G17
    status: active
    title: Prove a test can fail before trusting that it passes
    reason: >
      S05 added a test asserting that the API key never reaches a log record.
      That assertion is worthless if the code path never puts the key there in
      the first place, and nothing about a green run distinguishes the two. The
      same applies to the retry test written for the S03 bug: until the reset
      line was deleted and the test watched to fail, there was no evidence it
      covered anything. Both mutations took under a minute and both turned a
      passing test into evidence.
    applies_to: [backend, frontend, mobile, infrastructure, content, ops]
    severity: high
    discovered_in: S05
    discovered_on: 14/09/2026
    injection: >
      For any test that guards something important, a known past bug, a security
      property, a hard won invariant, break the code on purpose once and confirm
      that specific test fails by name. Restore it afterwards. A test that has
      never been seen to fail is decoration. Record the mutation and its result
      alongside the test, so the next person does not have to take it on trust.

  - id: G18
    status: active
    title: A claim about coverage must be checkable by a script, not by reading
    reason: >
      S05's criterion required every public function in the mapping module to
      have a test asserting a value. Reading the test file gave every impression
      that was true. A short script comparing the module's public functions
      against references in the tests found two that were exercised only
      indirectly through a caller. The suite was green and the coverage claim was
      false.
    applies_to: [backend, frontend, mobile, infrastructure, content, ops]
    severity: medium
    discovered_in: S05
    discovered_on: 14/09/2026
    injection: >
      Never state that something is fully covered, fully migrated or fully
      handled on the strength of having read it. Write the few lines that
      enumerate the population and check each member, then paste what it
      returned. Phrase the acceptance criterion so it names that check rather
      than a feeling, because a criterion a script can evaluate is the only kind
      that can catch you being wrong.

  - id: G19
    status: active
    title: Normalise the same input the same way everywhere it is accepted
    reason: >
      vessels_near_port normalised its port name with strip and lower from the
      first version, so " port klang " worked. The three filters on
      search_vessels compared raw input, so " malaysia " returned zero vessels
      when there are seven. Nobody decided that; the two were written at
      different times. It is not a crash and it does not look wrong, so an AI
      assistant would have relayed the empty result as fact. Every other defect
      in this project announced itself.
    applies_to: [backend, frontend, mobile, content, ops]
    severity: high
    discovered_in: S06
    discovered_on: 15/09/2026
    injection: >
      When more than one entry point accepts the same kind of input, a name, a
      code, a search term, normalise it in one shared function and call that
      function from every one of them. Never let one path strip and lowercase
      while another compares raw text. Before adding a second place that accepts
      an input, check how the first one treats it, and write a test that passes
      the same padded, mixed case value to both.

  - id: G20
    status: active
    title: Probe the running system before planning validation, not the source
    reason: >
      S06 was planned as "validate every tool input". Reading the code suggested
      a long list of crashes on bad types. Driving the running server over its
      real protocol showed that the framework already rejected every one of them
      before the code was reached, and that only three semantic defects
      remained. Planning from the source would have produced a story half of
      which reimplemented the framework.
    applies_to: [backend, infrastructure]
    severity: medium
    discovered_in: S06
    discovered_on: 15/09/2026
    injection: >
      Before planning validation, error handling or defensive code, send the bad
      input to the running system the way a real caller would and record what
      actually happens. Frameworks, serialisers and schema layers often handle
      more than the function body suggests. What raises a TypeError in a direct
      call may already be a clean error at the boundary, and defending against
      it twice adds a second thing to keep in step.

  - id: G21
    status: active
    title: Test both ends of a declared version range, not only the newest
    reason: >
      S04 declared mcp>=2,<3, which is a claim that the code works across every
      2.x release. Only 2.2.0, the newest, had been tested. The suite was run
      against 2.1.1 only by accident, because proving the upper bound worked
      downgraded the environment. It passed, but nothing in the plan had thought
      to check and no guardrail required it.
    applies_to: [backend, infrastructure]
    severity: medium
    discovered_in: S04
    discovered_on: 15/09/2026
    injection: >
      When you declare a dependency range, run the test suite against both the
      lowest version you claim to support and the newest, not just whatever pip
      happened to install. If testing the floor is impractical, narrow the
      declared range to what you actually tested rather than claiming breadth you
      have not verified.

  - id: G22
    status: active
    title: Revalidate a plan by executing it when the code has moved underneath it
    reason: >
      S04's plan was written before four other stories landed, and claimed the
      migration was two lines. Re-reading it suggested it was still accurate.
      Executing it in a scratch copy and running the full test suite found a
      renamed API attribute that broke two tests, before the story was approved.
      Reading would not have found it: the rename is invisible in the server's
      own source and invisible on the wire.
    applies_to: [backend, frontend, mobile, infrastructure, content, ops]
    severity: high
    discovered_in: S04
    discovered_on: 15/09/2026
    injection: >
      When a plan predates changes to the code it touches, do not revalidate it
      by reading. Perform the change in a scratch copy, run everything that
      exists against it, and update the plan from what happened. A plan that
      looks fine is not the same as a plan that still works, and the gap between
      them is exactly where a deferred story hides its surprises.

  - id: G23
    status: active
    title: Measure where the cost is before designing a fix for it
    reason: >
      S07 began as a suggestion to redesign the tool API: return summaries, add
      a detail lookup, add a fourth tool. Measuring the response by field first
      showed that 29 percent of it was indentation, 12 percent was coordinates
      printed to sixteen significant figures, and 15 percent was two fields the
      caller already had. Compact serialisation and rounding got half the saving
      with no new surface area, and the summary tool was dropped from the plan
      before it was written.
    applies_to: [backend, frontend, mobile, infrastructure]
    severity: high
    discovered_in: S07
    discovered_on: 15/09/2026
    injection: >
      Before planning any performance, size or cost work, measure where the cost
      actually is and break it down by component. Do not design from an
      impression of what is expensive, including your own architectural
      instinct. The fix that first comes to mind is usually structural, and the
      measurement often shows the cost is somewhere cheaper to address.

  - id: G24
    status: active
    title: Report the cost an optimisation adds, in the same units as the saving
    reason: >
      S07 cut a typical response by 81 percent while growing the tool schema by
      29 percent, because two tools gained a parameter with a description. The
      growth was found by reading a per response table, not because anything
      required looking for it, and the first instinct was to quote the 81
      percent and move on. A per call saving and a per session cost are
      different units, and quoting only the flattering one turns engineering
      into marketing.
    applies_to: [backend, frontend, mobile, infrastructure, ops]
    severity: medium
    discovered_in: S07
    discovered_on: 15/09/2026
    injection: >
      When you report an optimisation, report what it cost as well as what it
      saved, measured the same way. State the units and the frequency: a saving
      per call against a cost per session is not a like for like comparison
      until you show where they break even. If the change adds nothing, say that
      you checked.

  - id: G25
    status: active
    title: Probing a third party service spends the production credential's quota
    reason: >
      S14 measured eighteen regions by opening a connection to aisstream for
      each one. After five, every subsequent connection was refused inside
      three seconds with code 1006, and the runs recorded 0.00 messages a
      second. Read as data those numbers say thirteen regions have no traffic,
      which is false; they were the rate limiter. Worse, the same API key runs
      production. The live service survived only because an established
      connection is exempt from the limit: had the collector needed to
      reconnect during that window, ais.ariefrse.my would have gone down
      because of a measurement run.
    applies_to: [backend, infrastructure, ops]
    severity: high
    discovered_in: S14
    discovered_on: 15/09/2026
    injection: >
      Before running any sweep against an external service, check whether the
      credential you are about to use is the one production depends on, and say
      so out loud. Assume connection attempts, not just messages, are rationed.
      Space the probes, cap how many you will make, and after the run check the
      live service before trusting any of the numbers. A result that looks like
      an absence of data is the first thing to re-examine: a throttled probe and
      an empty region are indistinguishable in the output and only one of them
      is true.

  - id: G26
    status: active
    title: Exercise the unknown case through every entry point that can meet it
    reason: >
      regions.rate_for returns None when a selection contains a region nobody
      has measured, which was the whole point of writing it. Collector.set_regions
      then compared that value to the budget inline, rate <= STABLE_BUDGET_PER_S,
      so an unmeasured region raised TypeError and the entire call failed. Nine
      tests covered set_regions and every one of them selected measured regions,
      so none of them ever produced the None the function was designed around.
      The bug was found by driving the real endpoint with a region picked at
      random, not by the suite.
    applies_to: [backend, frontend, mobile, content, ops]
    severity: high
    discovered_in: S14
    discovered_on: 15/09/2026
    injection: >
      When a function can return null, unknown or not-applicable, list every
      caller and write a test that drives each one with that value. Do not
      assume a caller handles it because the producer was carefully written to
      emit it: the producer and the consumer are usually written at different
      moments and the consumer is where the comparison happens. Where a helper
      exists to answer the question safely, call the helper rather than
      repeating its comparison inline, and treat a duplicated comparison as the
      smell that it is.

