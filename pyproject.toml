[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maritime-mcp-server"
version = "0.1.0"
description = "Model Context Protocol server exposing maritime vessel data as MCP tools and a resource"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ariefrse" }]
keywords = ["mcp", "model-context-protocol", "maritime", "ais", "vessels"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Upper bound is deliberate. mcp 2.x renamed FastMCP to MCPServer and moved
# mcp.server.fastmcp, which this code imports. See divergence D-1 in the S01 plan.
dependencies = ["mcp>=1.2.0,<2"]

[project.urls]
Homepage = "https://github.com/Ariefrse/maritime-mcp-server"

[project.scripts]
maritime-mcp-server = "maritime_mcp_server.server:main"

[tool.setuptools]
packages = ["maritime_mcp_server"]

[tool.setuptools.package-data]
maritime_mcp_server = ["data/*.json"]
