[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maritime-mcp-server"
version = "0.1.0"
description = "Model Context Protocol server exposing maritime vessel data as MCP tools and a resource"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ariefrse" }]
keywords = ["mcp", "model-context-protocol", "maritime", "ais", "vessels"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Upper bounds are deliberate, per guardrail G1.
#   mcp: targets the 2.x MCPServer API. The 1.x line called this class FastMCP.
#        Migrated in S04; the <2 pin added in S01 was a holding position.
#   websockets: 17.x is current and requires Python 3.11, which is why the
#        requires-python floor above was raised from 3.10 in S03.
dependencies = ["mcp>=2,<3", "websockets>=17,<18"]

[project.optional-dependencies]
# Test only. A plain `pip install .` does not pull these.
dev = ["pytest>=9,<10"]

[project.urls]
Homepage = "https://github.com/ariefrsee/maritime-mcp-server"

[project.scripts]
maritime-mcp-server = "maritime_mcp_server.server:main"

[tool.setuptools]
packages = ["maritime_mcp_server"]

[tool.setuptools.package-data]
maritime_mcp_server = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["anyio: async test, run on the asyncio backend"]
